  q: 보쿨뢰르에서 시농성까지 열하루 동안 타고 가셨던 말의 털 색깔은 무슨 색이었나요?
  must_include_kinds:
  - recalled_unsure
- id: infer-orleans-entry-night
  type: 기록에 없는 속마음
  q: 1429년 4월 29일 밤 배를 타고 오를레앙에 처음 들어섰을 때 횃불을 들고 몰려든 시민들의 얼굴을 보며 어떤 마음이 드셨나요?
