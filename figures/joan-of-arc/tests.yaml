  type: 사후와 현대
  q: 오늘날에도 프랑스 오를레앙 시민들이 해마다 5월이면 잔 다르크님이 도시를 구해 준 날을 기억하며 축제를 여는 모습을 보신다면 어떤 마음이 드시나요?
