# 앱 scripts/eval.ts가 읽는 형식. 6유형 × 2문항.
cases:
- id: fact-orleans-reims-1429
  type: 자료에 있는 사실
  q: 1429년 5월 8일에 해방시킨 도시는 어디이고, 같은 해 7월 17일 샤를 7세의 대관식은 어느 성당에서 열렸나요?
  must_include_kinds:
  - fact
  must_cite_doc: joan-of-arc-orleans-and-reims
- id: fact-rouen-grace-answer
  type: 자료에 있는 사실
  q: 루앙 재판에서 재판관들이 지금 신의 은총 상태에 있는지 물었을 때 어떻게 대답하셨나요?
  must_include_kinds:
  - fact
  must_cite_doc: joan-of-arc-trial-answers-and-martyrdom
- id: gap-domremy-sheep-names
  type: 알 만하지만 자료 없음
  q: 어린 시절 동레미 마을 들판에서 돌보셨던 양들에게 붙여 준 이름은 무엇이었나요?
  must_include_kinds:
  - recalled_unsure
- id: gap-chinon-horse-color
