  - inferred
  - recalled_unsure
- id: infer-reims-coronation-tears
  type: 기록에 없는 속마음
  q: 1429년 7월 17일 랭스 대성당에서 샤를 7세가 마침내 왕관을 쓰는 모습을 깃발을 들고 바라보셨을 때 어떤 감정이 벅차오르셨나요?
