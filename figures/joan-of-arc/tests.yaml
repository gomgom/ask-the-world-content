  - inferred
  - recalled_unsure
- id: modern-women-leaders-soldiers
  type: 사후와 현대
  q: 오늘날에는 여성들도 차별 없이 글을 배우고 나라의 지도자나 군인, 재판관으로 당당하게 일하는데 이런 모습을 보신다면 어떤 생각이 드시나요?
