# 인물 자료 형식 검사
#
# 검증 로직을 이 저장소에 복사하지 않는다 — 두 곳에 있으면 반드시 어긋난다.
# 대신 앱 저장소를 체크아웃해 그쪽 스크립트를 그대로 빌려 쓴다.
#
# 여기서는 **형식만** 본다. 답변 품질(npm run eval)은 API 키가 필요하므로
# 운영자가 앱 저장소에서 태그를 올릴 때 돌린다.

name: 자료 형식 검사

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # 토큰이 없으면 **여기서** 멈춘다.
      # 없이 checkout 으로 들어가면 "Input required and not supplied: token" 이라는
      # 원인을 알 수 없는 오류만 남는다. 실제로 그렇게 한 번 실패했다.
      - name: 앱 저장소 읽기 토큰 확인
        env:
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          if [ -z "$APP_REPO_TOKEN" ]; then
            echo "::error::APP_REPO_TOKEN 시크릿이 없습니다."
            echo ""
            echo "검증 스크립트는 앱 저장소(gomgom/ask-the-world)에 있고 그 저장소는 비공개입니다."
            echo "로직을 여기에 복사하지 않는 대신 읽기 전용 토큰으로 가져옵니다."
            echo ""
            echo "넣는 곳은 Cloudflare 가 아니라 **GitHub 이 저장소**입니다:"
            echo "  1) github.com/settings/personal-access-tokens 에서 Fine-grained token 생성"
            echo "     · Repository access: gomgom/ask-the-world 만"
            echo "     · Permissions: Contents = Read-only"
            echo "  2) 이 저장소 → Settings → Secrets and variables → Actions"
            echo "     → New repository secret → 이름 APP_REPO_TOKEN"
            echo ""
            echo "그때까지는 로컬에서 이 명령으로 같은 검사를 할 수 있습니다:"
            echo "  npx tsx scripts/build-index.ts --figures <이 저장소>/figures --check-only"
            exit 1
          fi

      - name: 자료 저장소 가져오기
        uses: actions/checkout@v5
        with:
          path: content

      # 앱 저장소는 **비공개**다. 검증 스크립트를 여기에 복사하지 않는 대신
      # 읽기 전용 토큰으로 체크아웃한다 — 두 곳에 두면 반드시 어긋나기 때문이다.
      #
      # 준비: 이 저장소 Settings → Secrets → Actions 에 `APP_REPO_TOKEN` 을 넣는다.
      #   GitHub → Settings → Developer settings → Personal access tokens →
      #   Fine-grained tokens → gomgom/ask-the-world 에 Contents: Read-only
      - name: 앱 저장소 가져오기 (검증 스크립트를 빌려 쓴다)
        uses: actions/checkout@v5
        with:
          repository: gomgom/ask-the-world
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 의존성 설치
        working-directory: app
        run: npm ci

      - name: 형식 검사
        working-directory: app
        run: npx tsx scripts/build-index.ts --figures ../content/figures --check-only

      - name: 검사 항목 안내
        if: failure()
        run: |
          echo "형식 검사에 걸렸습니다. 흔한 원인:"
          echo "  · figure.md 의 id 와 폴더 이름이 다름"
          echo "  · living 이 true/false 가 아님"
          echo "  · quotable: true 인데 source 가 비어 있음"
          echo "  · doc_id 가 다른 문서와 겹침"
          echo "  · docs/ 에 문서가 하나도 없음"
          echo ""
          echo "자세한 규칙은 CONTRIBUTING.md 를 봐 주세요."
